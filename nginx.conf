# subwayMeme 리버스 프록시 설정.
# ngrok static 도메인은 포트 하나(443/wss)만 노출하므로, URL path 로 로비/게임을 구분한다.
#   wss://<도메인>/lobby -> websockify 8770 -> LobbyServer 7770
#   wss://<도메인>/game  -> websockify 8771 -> GameServer  7771
# 실행: nginx -c <이 파일 절대경로> -g 'daemon off;'

worker_processes 1;
error_log /tmp/subwaymeme-nginx-error.log warn;
pid       /tmp/subwaymeme-nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/subwaymeme-nginx-access.log;

    # WebSocket 업그레이드 헤더 전달용. Upgrade 요청이면 Connection: upgrade, 아니면 close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # 로비: /lobby -> 로비 websockify
        location /lobby {
            proxy_pass http://127.0.0.1:8770;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            # WebSocket 은 장시간 idle 가능하므로 타임아웃을 길게 둔다 (기본 60s 면 끊김).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 게임: /game -> 게임 websockify
        location /game {
            proxy_pass http://127.0.0.1:8771;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
